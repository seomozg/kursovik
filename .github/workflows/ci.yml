# CI: backend tests (pytest) + frontend checks (vitest + production build).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend / pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — та же версия, что в production-образе (Dockerfile.backend)
        python-version: ['3.11']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies (versions from pyproject.toml)
        run: |
          pip install --upgrade pip
          pip install \
            'fastapi~=0.104.1' \
            'uvicorn~=0.24.0' \
            'sqlalchemy~=2.0.23' \
            'alembic~=1.12.1' \
            'psycopg2-binary~=2.9.9' \
            'redis~=5.0.1' \
            'httpx~=0.25.2' \
            'pydantic~=2.5.0' \
            'python-multipart~=0.0.6' \
            'sse-starlette~=1.8.2' \
            'python-dotenv~=1.0.0' \
            'websockets~=16.0' \
            'requests~=2.31.0' \
            'pytest~=7.4.3' \
            'pytest-asyncio~=0.21.1'

      - name: Run tests
        run: pytest -q

  frontend-checks:
    name: Frontend / vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build