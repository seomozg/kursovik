version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8082:8000"
    environment:
      - DATABASE_URL=sqlite:///./kursovik.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8083:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: PostgreSQL database (uncomment if needed)
